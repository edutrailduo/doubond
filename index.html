<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e54"><meta name="apple-mobile-web-app-capable" content="yes"><title>DuoBond</title>
<style>
:root{color-scheme:light;--green:#075e54;--pale:#d9fdd3;--bg:#efeae2;--ink:#111b21;--muted:#667781;--line:#e7e7e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}.app{height:100dvh;max-width:760px;margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 30px #0001}.top{height:66px;background:var(--green);color:white;display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}.avatar{width:42px;height:42px;border-radius:50%;background:#d5e8df;color:#075e54;display:grid;place-items:center;font-weight:800;font-size:19px}.topinfo{flex:1}.topname{font-weight:700}.presence{font-size:12px;opacity:.85}.top button{background:transparent;color:white;border:1px solid #ffffff55;border-radius:18px;padding:7px 11px}.login{margin:auto;width:min(90%,420px);padding:28px}.login h1{color:var(--green)}input{font:inherit}.login input{display:block;width:100%;padding:13px;border:1px solid #ccd3d6;border-radius:10px;margin:9px 0 16px}.primary{background:var(--green);color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:700}.login .primary{width:100%}.error{color:#b3261e;min-height:20px;font-size:13px}.messages{flex:1;overflow:auto;padding:18px 13px;display:flex;flex-direction:column;gap:8px;background-color:#efeae2;background-image:radial-gradient(#d8d2c9 0.6px,transparent .6px);background-size:18px 18px}.bubble{max-width:82%;padding:9px 11px 6px;border-radius:10px;background:white;box-shadow:0 1px 1px #0001;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{align-self:flex-end;background:var(--pale)}.time{font-size:10px;color:#667781;text-align:right;margin-top:4px}.empty{margin:auto;color:#667781;background:#ffffffdb;padding:12px 18px;border-radius:12px;text-align:center}.composer{display:flex;gap:8px;padding:10px;background:#f0f2f5;align-items:center}.composer input{min-width:0;flex:1;border:0;border-radius:24px;padding:13px 16px;background:white;outline:none}.composer button{border:0;border-radius:24px;background:var(--green);color:white;padding:11px 17px;font-weight:700}.hint{font-size:12px;color:var(--muted);padding:0 14px 8px;background:#f0f2f5}.hidden{display:none!important}
</style></head><body><main class="app">
<header class="top"><div class="avatar" id="avatar">D</div><div class="topinfo"><div class="topname" id="partnerName">DuoBond</div><div class="presence" id="status">Private chat</div></div><button id="logout" class="hidden">Log out</button></header>
<section id="login" class="login"><h1>DuoBond</h1><p>A private chat for two.</p><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required placeholder="Email address"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Password"><button class="primary" id="loginBtn">Sign in</button></form><div class="error" id="error"></div></section>
<section id="chat" class="hidden" style="display:flex;flex:1;min-height:0;flex-direction:column"><div id="messages" class="messages"><div class="empty">Your conversation starts here.</div></div><form id="sendForm" class="composer"><input id="message" maxlength="5000" autocomplete="off" placeholder="Message"><button id="send" type="submit">Send</button></form><div class="hint">Messages appear here in real time when both people are connected.</div></section>
</main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://lunkifqokwvecmtohzxs.supabase.co','sb_publishable_HHoiVrTv5JmQDGgNJmBmtA_ITexssLE',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let user=null,peerId=null,channel=null,role=localStorage.getItem('duobond-local-role')||'';
function setStatus(t){$('status').textContent=t}
function safe(t){return String(t??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
function showLogin(msg=''){$('login').classList.remove('hidden');$('chat').classList.add('hidden');$('logout').classList.add('hidden');$('error').textContent=msg;user=null}
function roleSetup(){if(!['Husband','Wife'].includes(role)){const a=prompt('On this phone type Husband or Wife','');role=(a||'').trim().toLowerCase()==='husband'?'Husband':(a||'').trim().toLowerCase()==='wife'?'Wife':'';if(role)localStorage.setItem('duobond-local-role',role)}const name=role==='Husband'?'Wife':'Husband';$('partnerName').textContent=name;$('avatar').textContent=name[0]}
function draw(m){if(document.querySelector('[data-id="'+m.id+'"]'))return;const empty=$('messages').querySelector('.empty');if(empty)empty.remove();const n=document.createElement('div');n.className='bubble'+(m.sender_id===user.id?' mine':'');n.dataset.id=m.id;const body=document.createElement('div');body.textContent=m.body||'';const time=document.createElement('div');time.className='time';time.textContent=new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});n.append(body,time);$('messages').append(n);$('messages').scrollTop=$('messages').scrollHeight}
async function load(){const {data,error}=await sb.from('messages').select('id,sender_id,body,created_at').order('created_at',{ascending:true}).limit(300);if(error)throw error;$('messages').innerHTML='';if(!data?.length)$('messages').innerHTML='<div class="empty">Say hello to start your conversation.</div>';for(const m of data||[])draw(m)}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('duobond-simple-chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>draw(p.new)).subscribe(s=>{if(s==='SUBSCRIBED')setStatus('Connected') ;else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT')setStatus('Reconnecting…')})}
async function enter(u){user=u;roleSetup();$('login').classList.add('hidden');$('chat').classList.remove('hidden');$('logout').classList.remove('hidden');setStatus('Connecting…');try{const {data:members,error}=await sb.from('duo_members').select('user_id');if(error)throw error;const ids=(members||[]).map(x=>x.user_id);if(!ids.includes(user.id)||ids.length<2)throw new Error('This login is not linked to the two-person DuoBond members. Check duo_members in Supabase.');peerId=ids.find(x=>x!==user.id);await load();subscribe()}catch(e){setStatus('Connection issue');$('messages').innerHTML='<div class="empty">'+safe(e.message)+'</div>';}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;$('error').textContent='Signing in…';const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;if(error){$('error').textContent=error.message;return}await enter(data.user)});
$('sendForm').addEventListener('submit',async e=>{e.preventDefault();const body=$('message').value.trim();if(!body||!user)return;$('send').disabled=true;const {data,error}=await sb.from('messages').insert({sender_id:user.id,body}).select('id,sender_id,body,created_at').single();$('send').disabled=false;if(error){alert('Message not sent: '+error.message);return}$('message').value='';draw(data)});
$('logout').addEventListener('click',async()=>{if(channel)await sb.removeChannel(channel);await sb.auth.signOut();showLogin()});
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')showLogin();else if(session?.user&&!user)enter(session.user)});
const {data:{session}}=await sb.auth.getSession();if(session?.user)await enter(session.user);else showLogin();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
