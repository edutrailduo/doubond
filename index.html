<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="A private space for two.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>DuoBond</title>
  <style>
    :root{color-scheme:dark;--bg:#101114;--panel:#191b20;--panel2:#22252c;--line:#30333b;--text:#f5f5f6;--muted:#9b9da7;--accent:#d9c6a1;--mine:#344638;--theirs:#252832}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif;min-height:100dvh}
    button,input{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:13px 17px;background:var(--accent);color:#171717;font-weight:650}
    .shell{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
    header{display:flex;align-items:center;justify-content:space-between;padding:20px 4px 16px;border-bottom:1px solid var(--line)}
    .brand{font-size:22px;font-weight:750;letter-spacing:.3px}.sub{font-size:12px;color:var(--muted);margin-top:2px}
    .status{font-size:12px;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:430px;margin:auto}
    h1{font-size:24px;margin:0 0 8px}.hint{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 20px}
    label{display:block;color:var(--muted);font-size:13px;margin:14px 0 7px}input{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;outline:none}input:focus{border-color:var(--accent)}
    .wide{width:100%;margin-top:18px}.error{color:#ff9c9c;font-size:13px;min-height:18px;margin-top:12px}.chat{display:none;flex:1;min-height:0;flex-direction:column}
    #messages{flex:1;overflow:auto;padding:18px 2px 14px;display:flex;flex-direction:column;gap:10px}
    .msg{max-width:82%;padding:11px 14px;border-radius:17px;background:var(--theirs);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
    .msg.mine{align-self:flex-end;background:var(--mine)}.time{font-size:10px;color:#b7b9c1;margin-top:5px;text-align:right}
    .composer{display:flex;gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.composer input{min-width:0;flex:1}.composer button{padding-inline:18px}
    .empty{color:var(--muted);text-align:center;margin:auto;font-size:14px;padding:30px 10px}.hidden{display:none!important}
    footer{font-size:11px;color:var(--muted);text-align:center;padding:10px}
  </style>
</head>
<body>
<div class="shell">
  <header><div><div class="brand">DuoBond</div><div class="sub">A private space for two</div></div><div id="topStatus" class="status">Not connected</div></header>
  <section id="auth" class="card">
    <h1>Welcome back</h1><p class="hint">Sign in with the account invited to your private DuoBond space.</p>
    <form id="loginForm">
      <label for="email">Email</label><input id="email" type="email" autocomplete="username" required placeholder="you@example.com">
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password">
      <button class="wide" id="loginBtn" type="submit">Sign in</button>
    </form>
    <div id="authError" class="error" role="alert"></div>
  </section>
  <section id="chat" class="chat">
    <div id="messages"><div class="empty">Your private conversation starts here.</div></div>
    <form id="sendForm" class="composer"><input id="messageInput" maxlength="5000" autocomplete="off" placeholder="Write a message..." aria-label="Message"><button type="submit">Send</button></form>
  </section>
  <footer>Private two-member chat · Keep your password private</footer>
</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://lunkifqokwvecmtohzxs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HHoiVrTv5JmQDGgNJmBmtA_ITexssLE';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let currentUser = null;
let channel = null;
let seen = new Set();

function showAuth(message='') {
  $('auth').classList.remove('hidden'); $('chat').style.display='none';
  $('authError').textContent=message; $('topStatus').textContent='Not connected';
}
function showChat(user) {
  currentUser=user; $('auth').classList.add('hidden'); $('chat').style.display='flex';
  $('topStatus').textContent='Connected'; loadMessages(); subscribeMessages();
}
function addMessage(m) {
  if(seen.has(m.id)) return; seen.add(m.id);
  const empty=$('messages').querySelector('.empty'); if(empty) empty.remove();
  const node=document.createElement('div'); node.className='msg'+(m.sender_id===currentUser.id?' mine':'');
  const body=document.createElement('div'); body.textContent=m.body;
  const time=document.createElement('div'); time.className='time';
  time.textContent=new Date(m.created_at).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  node.append(body,time); $('messages').append(node); $('messages').scrollTop=$('messages').scrollHeight;
}
async function loadMessages() {
  const {data,error}=await supabase.from('messages').select('id,sender_id,body,created_at').order('created_at',{ascending:true}).limit(200);
  if(error){$('topStatus').textContent='Chat load error'; console.error(error);return;}
  $('messages').innerHTML=''; seen.clear();
  if(!data?.length) $('messages').innerHTML='<div class="empty">Your private conversation starts here.</div>';
  (data||[]).forEach(addMessage);
}
function subscribeMessages() {
  if(channel) supabase.removeChannel(channel);
  channel=supabase.channel('duobond-messages').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},payload=>addMessage(payload.new)).subscribe();
}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); $('loginBtn').disabled=true; $('authError').textContent='Signing in...';
  const {data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  $('loginBtn').disabled=false;
  if(error){$('authError').textContent=error.message;return;}
  showChat(data.user);
});
$('sendForm').addEventListener('submit',async e=>{
  e.preventDefault(); const body=$('messageInput').value.trim(); if(!body||!currentUser)return;
  const btn=$('sendForm').querySelector('button');btn.disabled=true;
  const {error}=await supabase.from('messages').insert({sender_id:currentUser.id,body});
  btn.disabled=false;
  if(error){$('topStatus').textContent='Message not sent';console.error(error);return;}
  $('messageInput').value='';$('topStatus').textContent='Connected';
});
supabase.auth.onAuthStateChange((_event,session)=>{
  if(session?.user) showChat(session.user);
  else {currentUser=null;if(channel){supabase.removeChannel(channel);channel=null;}showAuth();}
});
const {data:{session}}=await supabase.auth.getSession();
if(session?.user) showChat(session.user); else showAuth();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
</script>
</body>
</html>
