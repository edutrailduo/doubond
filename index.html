<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100d12"><meta name="description" content="A private space for two.">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>DuoBond</title>
<style>
:root{color-scheme:dark;--bg:#100d12;--panel:#1b151c;--panel2:#261d27;--line:#493443;--text:#f8f1f4;--muted:#b9a7b2;--gold:#d8bd91;--rose:#b8798e;--mine:#422d3a;--theirs:#29232d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#291a27 0,#100d12 58%);color:var(--text);font:16px system-ui,-apple-system,sans-serif;min-height:100dvh}
button,input{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:13px 17px;background:linear-gradient(135deg,var(--gold),#b98d72);color:#1a1216;font-weight:700}
button:disabled{opacity:.5;cursor:not-allowed}.shell{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 4px 17px;border-bottom:1px solid var(--line)}
.brand{font-family:Georgia,serif;font-size:27px;letter-spacing:1.1px;color:var(--gold)}.sub{font-size:12px;color:var(--muted);margin-top:3px}.status{font-size:12px;color:var(--gold);text-align:right}
.card{background:rgba(27,21,28,.94);border:1px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:460px;margin:auto;box-shadow:0 18px 55px #0005}
h1{font-family:Georgia,serif;font-size:26px;font-weight:500;margin:0 0 8px}.hint{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 7px}input{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;outline:none}input:focus{border-color:var(--gold)}
.wide{width:100%;margin-top:18px}.error{color:#ffaaa9;font-size:13px;min-height:18px;margin-top:12px}.home{display:none;flex:1;padding-top:22px}.contactRow{display:flex;align-items:center;gap:14px;padding:17px;background:rgba(27,21,28,.94);border:1px solid var(--line);border-radius:18px;cursor:pointer}.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#d8bd91,#9d657d);color:#21151b;font-size:22px;font-weight:800}.contactName{font-weight:700}.contactPreview{font-size:13px;color:var(--muted);margin-top:4px}.chat{display:none;flex:1;min-height:0;flex-direction:column}
#security{display:none;background:#211820;border:1px solid var(--line);border-radius:17px;padding:15px;margin:14px 0;color:var(--muted);font-size:13px;line-height:1.55}
.fingerprint{font-family:ui-monospace,monospace;color:var(--gold);font-size:12px;overflow-wrap:anywhere;margin:8px 0}
.verify{display:flex;gap:9px;align-items:flex-start;margin-top:12px}.verify input{width:auto;margin-top:3px}.verify label{margin:0;color:var(--text)}
#messages{flex:1;overflow:auto;padding:18px 2px 14px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.msg{max-width:84%;padding:12px 14px;border-radius:17px;background:var(--theirs);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;border:1px solid #493443}
.msg.mine{align-self:flex-end;background:var(--mine)}.msgActions{display:flex;justify-content:flex-end;gap:8px;margin-top:7px}.loveBtn{padding:4px 9px;background:#34232f;color:#f3c4d2;border:1px solid #624052;font-size:13px}.loveCount{font-size:11px;color:#f3c4d2;align-self:center}.time{font-size:10px;color:#c7b5c0;margin-top:6px;text-align:right}
.meta{font-size:10px;color:var(--gold);text-align:right;margin-top:3px}.composer{display:flex;gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.composer input{min-width:0;flex:1}.composer button{padding-inline:18px}
.empty{color:var(--muted);text-align:center;margin:auto;font-size:14px;padding:30px 10px}.hidden{display:none!important}
footer{font-size:11px;color:var(--muted);text-align:center;padding:10px}
</style></head>
<body><div class="shell">
<header><div><div class="brand">DuoBond</div><div class="sub" id="partnerLabel">Just us, in our own little world</div></div><div style="text-align:right"><div id="topStatus" class="status">Not connected</div><div style="display:flex;gap:6px;justify-content:flex-end;margin-top:7px"><button id="nicknameBtn" type="button" style="padding:7px 10px;font-size:11px">Edit names</button><button id="logoutBtn" type="button" style="padding:7px 10px;font-size:11px">Log out</button></div></div></header>
<section id="auth" class="card"><h1>Welcome back</h1><p class="hint">A private space for two. Sign in to continue.</p>
<form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required placeholder="you@example.com">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password">
<button class="wide" id="loginBtn" type="submit">Sign in</button></form><div id="authError" class="error" role="alert"></div></section>
<section id="home" class="home"><div class="sub" style="margin:0 4px 12px">CHATS</div><button id="wifeChat" type="button" class="contactRow" style="width:100%;text-align:left;color:var(--text);background:rgba(27,21,28,.94);border:1px solid var(--line);"><div class="avatar" id="wifeAvatar">W</div><div style="min-width:0;flex:1"><div class="contactName" id="wifeName">Wife</div><div class="contactPreview" id="wifePreview">Tap to open your private conversation</div></div><div class="status">›</div></div></section>
<section id="chat" class="chat"><div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)"><button id="backHome" type="button" style="padding:8px 13px">‹</button><div><div id="chatPartnerName" style="font-weight:700">Wife</div><div class="sub">Private conversation</div></div><button id="blockBtn" type="button" style="margin-left:auto;padding:8px 10px;font-size:11px">Block</button></div><div id="security"><strong style="color:var(--gold)">Device security check</strong><div id="securityText">Preparing your device key…</div>
<div id="peerFingerprint" class="fingerprint"></div><div class="verify"><input id="verifyCheck" type="checkbox"><label for="verifyCheck">I compared this fingerprint with my partner through a separate trusted channel.</label></div>
<button id="trustBtn" class="wide" type="button">Confirm fingerprint</button><div id="securityError" class="error"></div></div>
<div id="messages"><div class="empty">Your conversation starts here.</div></div>
<form id="sendForm" class="composer"><input id="messageInput" maxlength="5000" autocomplete="off" placeholder="Write something from the heart…" aria-label="Message"><button id="sendBtn" type="submit" disabled>Send</button></form></section>
<footer>Encryption temporarily off · Messages are stored as plain text</footer></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { getOrCreateDeviceKey, deriveChatKey, encryptText, decryptText, conversationFingerprint } from './crypto.js';
const supabase=createClient('https://lunkifqokwvecmtohzxs.supabase.co','sb_publishable_HHoiVrTv5JmQDGgNJmBmtA_ITexssLE',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:'duobond-auth-session'}});
const $=id=>document.getElementById(id);let currentUser=null,channel=null,receiptChannel=null,device=null,chatKey=null,peer=null,ready=false,seen=new Set(),receiptMap=new Map(),myNickname='',peerNickname='';
const trustedKey='duobond-peer-fingerprint-v1';
function status(t){$('topStatus').textContent=t}
function showAuth(msg=''){$('auth').classList.remove('hidden');$('home').style.display='none';$('chat').style.display='none';$('authError').textContent=msg;status('Not connected')}
function showChat(user){currentUser=user;$('auth').classList.add('hidden');$('home').style.display='block';$('chat').style.display='none';loadPartnerProfile();setupEncryption().catch(e=>securityFail(e.message));}
async function loadPartnerProfile(){const {data:members}=await supabase.from('duo_members').select('user_id');const partner=members?.find(x=>x.user_id!==currentUser.id);if(!partner)return;const {data}=await supabase.from('duo_profiles').select('nickname').eq('user_id',partner.user_id).maybeSingle();peerNickname=data?.nickname||'Wife';$('wifeName').textContent=peerNickname;$('chatPartnerName').textContent=peerNickname;$('wifeAvatar').textContent=peerNickname.trim().charAt(0).toUpperCase()||'W';}
async function openConversation(){ $('home').style.display='none';$('chat').style.display='flex';$('chat').style.visibility='visible';$('partnerLabel').textContent=peerNickname||'Your private conversation';$('chatPartnerName').textContent=peerNickname||'Wife';$('messages').innerHTML='<div class="empty">Loading your messages…</div>';status('Inbox opened');$('sendBtn').disabled=!ready; if(!currentUser){$('messages').innerHTML='<div class="empty">Please sign in again.</div>';return;} try{await loadMessages();}catch(e){$('messages').innerHTML='<div class="empty">Message loading failed: '+String(e.message||e).replace(/[<>&]/g,'')+'</div>';} if(ready){subscribeMessages();subscribeReceipts();subscribeReactions();} try{await refreshBlockState();}catch(e){console.warn(e);$('sendBtn').disabled=!ready;}}
async function refreshBlockState(){const {data:members}=await supabase.from('duo_members').select('user_id');const partner=members?.find(x=>x.user_id!==currentUser.id);if(!partner)return;const {data}=await supabase.from('duo_blocks').select('blocker_id,blocked_id').or('and(blocker_id.eq.'+currentUser.id+',blocked_id.eq.'+partner.user_id+'),and(blocker_id.eq.'+partner.user_id+',blocked_id.eq.'+currentUser.id+')');const blocked=!!data?.length;$('blockBtn').textContent=blocked?'Unblock':'Block';$('sendBtn').disabled=!ready||blocked;}
function securityFail(msg){ready=false;chatKey=null;$('sendBtn').disabled=true;$('security').style.display='block';$('securityError').textContent=msg;status('Security setup needed')}
async function setupEncryption(){
 // Encryption is temporarily paused. Keep an optional key only to read older encrypted messages.
 ready=false;$('sendBtn').disabled=true;$('security').style.display='none';
 try{
  device=await getOrCreateDeviceKey();
  const {error:upErr}=await supabase.from('duo_device_keys').upsert({user_id:currentUser.id,public_key:JSON.stringify(device.publicJwk),fingerprint:device.fingerprint,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(!upErr){
   const {data:allKeys}=await supabase.from('duo_device_keys').select('user_id,public_key,fingerprint');
   const keys=allKeys?.find(x=>x.user_id!==currentUser.id);
   if(keys){peer={...keys,publicJwk:JSON.parse(keys.public_key)};chatKey=await deriveChatKey(device.pair.privateKey,peer.publicJwk);}
  }
 }catch(e){console.warn('Legacy encrypted-message key unavailable:',e);}
 chatKey=chatKey||null;
 await unlockChat();
}
async function unlockChat(){
 ready=true;$('security').style.display='none';$('sendBtn').disabled=false;status('Connected · Encryption off');
 await loadMessages();subscribeMessages();subscribeReceipts();subscribeReactions();
}
$('trustBtn').addEventListener('click',async()=>{
 if(!$('verifyCheck').checked){$('securityError').textContent='Please compare the fingerprint with your partner first.';return;}
 if(!peer)return;
 localStorage.setItem(trustedKey,$('peerFingerprint').textContent);
 await unlockChat();
});
function isEnvelope(body){try{const x=JSON.parse(body);return x?.v===1&&x?.alg==='A256GCM'}catch{return false}}
async function displayMessage(m){
 if(seen.has(m.id))return;seen.add(m.id);
 const empty=$('messages').querySelector('.empty');if(empty)empty.remove();
 const node=document.createElement('div');node.className='msg'+(m.sender_id===currentUser.id?' mine':'');
 const body=document.createElement('div');
 if(isEnvelope(m.body)){try{body.textContent=await decryptText(chatKey,m.body)}catch{body.textContent='Unable to decrypt this message on this device.'}}
 else body.textContent='[Older message · not encrypted] '+m.body;
 const time=document.createElement('div');time.className='time';time.textContent=new Date(m.created_at).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
 node.append(body,time);
 if(m.sender_id===currentUser.id){const meta=document.createElement('div');meta.className='meta';meta.textContent=receiptMap.get(m.id)||'Sent';node.append(meta);node.dataset.messageId=m.id;}
 $('messages').append(node);$('messages').scrollTop=$('messages').scrollHeight;
 if(m.sender_id!==currentUser.id)await markReceived(m.id,true);
}
async function loadLove(id,button,count){
 const {data,error}=await supabase.from('message_reactions').select('user_id').eq('message_id',id);
 if(error)return;count.textContent=data?.length?String(data.length):'';
 button.textContent=data?.some(x=>x.user_id===currentUser.id)?'♥ Loved':'♡ Love';
}
async function toggleLove(id,button){
 const {data}=await supabase.from('message_reactions').select('user_id').eq('message_id',id).eq('user_id',currentUser.id).maybeSingle();
 let result;
 if(data)result=await supabase.from('message_reactions').delete().eq('message_id',id).eq('user_id',currentUser.id);
 else result=await supabase.from('message_reactions').insert({message_id:id,user_id:currentUser.id,reaction:'❤️'});
 if(result.error){$('securityError').textContent=result.error.message;return;}
 const count=button.parentElement.querySelector('.loveCount');await loadLove(id,button,count);
}
async function loadMessages(){
 const {data,error}=await supabase.from('messages').select('id,sender_id,body,created_at').order('created_at',{ascending:true}).limit(200);
 if(error)throw error;
 const ids=(data||[]).filter(m=>m.sender_id===currentUser.id).map(m=>m.id);
 if(ids.length){const {data:rs}=await supabase.from('message_receipts').select('message_id,delivered_at,seen_at').in('message_id',ids);(rs||[]).forEach(r=>receiptMap.set(r.message_id,r.seen_at?'Seen':r.delivered_at?'Delivered':'Sent'));}
 $('messages').innerHTML='';seen.clear();if(!data?.length)$('messages').innerHTML='<div class="empty">Your conversation starts here.</div>';
 for(const m of data||[])await displayMessage(m);
}
async function markReceived(id,visible){
 const now=new Date().toISOString();
 const {error}=await supabase.from('message_receipts').upsert({message_id:id,recipient_id:currentUser.id,delivered_at:now,seen_at:visible?now:null},{onConflict:'message_id,recipient_id'});
 if(error)console.warn('Receipt update:',error.message);
}
function subscribeMessages(){
 if(channel)supabase.removeChannel(channel);
 channel=supabase.channel('duobond-encrypted-messages').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},async p=>{if(ready)await displayMessage(p.new)}).subscribe();
}
function subscribeReactions(){supabase.channel('duobond-love-reactions').on('postgres_changes',{event:'*',schema:'public',table:'message_reactions'},async p=>{const id=p.new?.message_id||p.old?.message_id;const b=$('messages').querySelector('[data-reaction-count="'+id+'"]')?.parentElement?.querySelector('.loveBtn');const c=$('messages').querySelector('[data-reaction-count="'+id+'"]');if(id&&b&&c)await loadLove(id,b,c);}).subscribe();}
function subscribeReceipts(){
 if(receiptChannel)supabase.removeChannel(receiptChannel);
 receiptChannel=supabase.channel('duobond-receipts').on('postgres_changes',{event:'*',schema:'public',table:'message_receipts'},p=>{
  const r=p.new;if(r?.recipient_id!==currentUser.id&&r?.message_id){const s=r.seen_at?'Seen':r.delivered_at?'Delivered':'Sent';receiptMap.set(r.message_id,s);const n=$('messages').querySelector('[data-message-id="'+r.message_id+'"] .meta');if(n)n.textContent=s;}
 }).subscribe();
}
$('wifeChat').addEventListener('click',e=>{e.preventDefault();openConversation().catch(err=>{status('Inbox error');$('messages').innerHTML='<div class="empty">'+String(err.message||err)+'</div>';});});$('backHome').addEventListener('click',()=>{$('chat').style.display='none';$('home').style.display='block';});
$('nicknameBtn').addEventListener('click',async()=>{
 if(!currentUser)return;const next=prompt('Set a nickname for your partner (1–30 characters):',peerNickname);if(!next?.trim())return;
 const nickname=next.trim().slice(0,30);const {data:members}=await supabase.from('duo_members').select('user_id');const partner=members?.find(x=>x.user_id!==currentUser.id);if(!partner)return;const {error}=await supabase.from('duo_profiles').upsert({user_id:partner.user_id,nickname},{onConflict:'user_id'});
 if(error){$('securityError').textContent=error.message;return;}peerNickname=nickname;await loadPartnerProfile();
});
$('logoutBtn').addEventListener('click',async()=>{if(!confirm('Log out of DuoBond on this device?'))return;await supabase.auth.signOut();});
$('blockBtn').addEventListener('click',async()=>{const {data:members}=await supabase.from('duo_members').select('user_id');const partner=members?.find(x=>x.user_id!==currentUser.id);if(!partner)return;const {data}=await supabase.from('duo_blocks').select('blocker_id').eq('blocker_id',currentUser.id).eq('blocked_id',partner.user_id).maybeSingle();if(data){const {error}=await supabase.from('duo_blocks').delete().eq('blocker_id',currentUser.id).eq('blocked_id',partner.user_id);if(error){alert(error.message);return;}$('blockBtn').textContent='Block';$('sendBtn').disabled=!ready;alert('Partner unblocked.');await refreshBlockState();}else{const {error}=await supabase.from('duo_blocks').insert({blocker_id:currentUser.id,blocked_id:partner.user_id});if(error){alert(error.message);return;}$('blockBtn').textContent='Unblock';$('sendBtn').disabled=true;alert('Partner blocked. New messages are disabled.');}});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;$('authError').textContent='Signing in…';const {data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;if(error){$('authError').textContent=error.message;return;}showChat(data.user);});
$('sendForm').addEventListener('submit',async e=>{
 e.preventDefault();const plain=$('messageInput').value.trim();if(!plain||!currentUser||!ready)return;
 const btn=$('sendBtn');btn.disabled=true;
 try{const body=plain;const {error}=await supabase.from('messages').insert({sender_id:currentUser.id,body});if(error)throw error;$('messageInput').value='';status('Sent');}
 catch(err){status('Message not sent');$('securityError').textContent=err.message;}
 finally{btn.disabled=false;}
});
supabase.auth.onAuthStateChange((event,session)=>{if(session?.user&&session.user.id!==currentUser?.id)showChat(session.user);else if(event==='SIGNED_OUT'){currentUser=null;ready=false;chatKey=null;if(channel)supabase.removeChannel(channel);if(receiptChannel)supabase.removeChannel(receiptChannel);showAuth();}});
const {data:{session}}=await supabase.auth.getSession();if(session?.user)showChat(session.user);else showAuth();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
</script></body></html>
